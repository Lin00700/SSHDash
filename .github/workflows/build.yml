name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project SSHDash.xcodeproj -scheme SSHDash

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SSHDash.xcodeproj \
            -scheme SSHDash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -15 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SSHDash.app Payload/
          zip -r SSHDash.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SSHDash-ipa
          path: SSHDash.ipa
